<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Database LK — SIPIL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebarMount"></div>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:14px;">
        <button id="burger" class="icon-btn" style="display:none;"><i class="fa-solid fa-bars"></i></button>
        <div class="page-title">Database LK<small>Seluruh data pengambilan nomor LK</small></div>
      </div>
      <div class="right">
        <span class="clock" id="clock"></span>
        <button id="btnExport" class="btn btn-ghost btn-sm"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
        <a href="pengambilan.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> Ambil Nomor</a>
      </div>
    </div>

    <div class="content">
      <div class="panel">
        <div class="panel-head" style="display:block;">
          <div class="toolbar" style="margin-bottom:0;">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="searchInput" placeholder="Cari nomor LK, nama, atau NIK/paspor...">
            </div>
            <div class="select-mini">
              <select id="filterKategori">
                <option value="">Semua Kategori</option>
                <option value="WNI">WNI</option>
                <option value="WNA">WNA</option>
              </select>
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nomor LK</th><th>Tanggal</th><th>Nama</th><th>Kategori</th>
                <th>Kebangsaan</th><th>NIK/Paspor</th><th>Jenis BAP</th>
                <th>Petugas</th><th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="10" style="text-align:center;color:#8895B3;padding:24px;">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination">
          <span class="info" id="pageInfo">—</span>
          <div class="pages" id="pageButtons"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL EDIT -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(11,36,71,0.45);z-index:100;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:26px;">
    <h3 style="margin:0 0 18px;color:#0B2447;">Edit Data LK</h3>
    <form id="formEdit">
      <input type="hidden" id="editNomorLK">
      <div class="form-grid">
        <div class="field">
          <label>Tanggal</label>
          <div class="input-wrap"><i class="fa-fixed fa-solid fa-calendar"></i><input type="date" id="editTanggal" required></div>
        </div>
        <div class="field">
          <label>Kategori</label>
          <div class="input-wrap"><i class="fa-fixed fa-solid fa-user-group"></i>
            <select id="editKategori" required><option value="WNI">WNI</option><option value="WNA">WNA</option></select>
          </div>
        </div>
        <div class="field full">
          <label>Nama</label>
          <div class="input-wrap"><i class="fa-fixed fa-solid fa-id-card"></i><input type="text" id="editNama" required></div>
        </div>
        <div class="field">
          <label>Kebangsaan</label>
          <div class="input-wrap"><i class="fa-fixed fa-solid fa-earth-asia"></i><input type="text" id="editKebangsaan" required></div>
        </div>
        <div class="field">
          <label>NIK/Paspor</label>
          <div class="input-wrap"><i class="fa-fixed fa-solid fa-passport"></i><input type="text" id="editNik" required></div>
        </div>
        <div class="field">
          <label>Jenis BAP</label>
          <div class="input-wrap"><i class="fa-fixed fa-solid fa-file-lines"></i><input type="text" id="editJenisBAP" required></div>
        </div>
        <div class="field full">
          <label>Perihal</label>
          <div class="input-wrap"><i class="fa-fixed fa-solid fa-pen"></i><input type="text" id="editPerihal" required></div>
        </div>
        <div class="field full">
          <label>Petugas</label>
          <div class="input-wrap"><i class="fa-fixed fa-solid fa-user-shield"></i><input type="text" id="editPetugas" required></div>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button type="submit" class="btn btn-primary" id="btnSaveEdit">Simpan Perubahan</button>
        <button type="button" class="btn btn-ghost" id="btnCancelEdit">Batal</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script src="js/shell.js"></script>
<script src="js/database.js"></script>
</body>
</html>
